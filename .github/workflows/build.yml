name: Build A205F KernelSU Next (Legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel with Legacy KernelSU Next Integration
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      ANDROID_MAJOR_VERSION: r
      PLATFORM_VERSION: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            zip

      - name: Setup KernelSU Next (Legacy Integration)
        shell: bash
        run: |
          echo "========================================"
          echo "Integrating KernelSU Next (Full Repo)"
          echo "========================================"

          # پاک کردن کدهای ناقص قبلی
          rm -rf drivers/KernelSU-Next || true
          rm -rf ksu-temp || true

          # کلون کردن مخزن تازه
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git drivers/KernelSU-Next --depth 1

          # معرفی پوشه به بیلد سیستم
          sed -i '/KernelSU-Next/d' drivers/Makefile || true
          echo 'obj-y += KernelSU-Next/kernel/' >> drivers/Makefile

          echo "========================================"
          echo "Deep Patching KernelSU Next for GCC 4.9 & Kernel 4.4"
          echo "========================================"
          
          # 1. اصلاح تنظیمات کامپایلر
          find drivers/KernelSU-Next/kernel -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Wno-gcc-compat//g' {} +
          find drivers/KernelSU-Next/kernel -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Wno-int-conversion//g' {} +
          find drivers/KernelSU-Next/kernel -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror//g' {} +
          echo 'ccflags-y += -Wno-error -Wno-undef -Wno-implicit-function-declaration' >> drivers/KernelSU-Next/kernel/Makefile
          
          # 2. تعریف صحیح syscall_fn_t
          sed -i '1i typedef long (*syscall_fn_t)();' drivers/KernelSU-Next/kernel/hook/syscall_hook.h
          
          # 3. اصلاح مسیر فایل‌های هدر
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/linux\/compiler_types.h/linux\/compiler.h/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/linux\/pgtable.h/asm\/pgtable.h/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/linux\/sched\/task_stack.h/linux\/sched.h/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/linux\/sched\/signal.h/linux\/sched.h/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/linux\/sched\/task.h/linux\/sched.h/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/uapi\/linux\/mount.h/linux\/mount.h/g' {} +
          
          # 4. ترجمه توابع مدرن به توابع معادل در کرنل 4.4
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/ksys_close/sys_close/g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/ksys_unshare/sys_unshare/g' {} +
          
          # 5. رفع خطای کستینگ در sucompat
          sed -i 's/regs->__PT_PARM2_REG = empty_user_path()/regs->__PT_PARM2_REG = (unsigned long)empty_user_path()/g' drivers/KernelSU-Next/kernel/feature/sucompat.c
          
          # 6. حل مشکل اخطار __x86_64__
          sed -i 's/#elif __x86_64__/#elif defined(__x86_64__)/g' drivers/KernelSU-Next/kernel/hook/patch_memory.h
          
          # 7. حل مشکل بنیادین LSM Hooks
          cat <<EOF > drivers/KernelSU-Next/kernel/hook/lsm_hook.c
          void ksu_lsm_hook(void) {}
          void ksu_lsm_unhook(void) {}
          EOF
          
          # 8. حل مشکلات Syscall Event Bridge
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/__nocfi //g' {} +
          find drivers/KernelSU-Next/kernel -type f -name "*.[ch]" -exec sed -i 's/untagged_addr//g' {} +
          sed -i '1i #include <linux/uaccess.h>' drivers/KernelSU-Next/kernel/hook/syscall_event_bridge.c
          
          # 9. حل مشکلات مدیریت حافظه در معماری ARM64
          sed -i '1i #include <linux/mm.h>\n#include <asm/pgtable.h>\ntypedef pgd_t p4d_t __attribute__((unused));\n#define p4d_val(x) pgd_val(x)\n#define p4d_bad(x) 0\n#define p4d_none(x) 0\n#define p4d_offset(pgd, addr) ((p4d_t *)(pgd))\n#define __pte_to_phys(pte) (pte_pfn(pte) << PAGE_SHIFT)' drivers/KernelSU-Next/kernel/hook/arm64/patch_memory.c
          sed -i 's/copy_to_kernel_nofault/probe_kernel_write/g' drivers/KernelSU-Next/kernel/hook/arm64/patch_memory.c
          sed -i 's/#define ksu_flush_icache.*/#define ksu_flush_icache(start, end) flush_icache_range(start, end)/g' drivers/KernelSU-Next/kernel/hook/arm64/patch_memory.c
          sed -i 's/void \*map = set_fixmap_offset/void \*map = (void \*)set_fixmap_offset/g' drivers/KernelSU-Next/kernel/hook/arm64/patch_memory.c
          
          # 10. حل قطعی مشکلات File Wrapper و سیستم VFS
          FILE_WRAPPER="drivers/KernelSU-Next/kernel/infra/file_wrapper.c"
          cat <<EOF > temp_wrapper.c
          #include <linux/module.h>
          #include <linux/err.h>
          #ifndef REMAP_FILE_DEDUP
          #define REMAP_FILE_DEDUP 0
          #endif
          #define security_inode_init_security_anon(a,b,c) 0
          #define alloc_file_pseudo(a,b,c,d,e) ERR_PTR(-ENODEV)
          #define selinux_inode(a) NULL
          typedef unsigned int __poll_t;
          void *ksu_dummy_var;
          #define ksu_dummy_func(...) 0
          EOF
          cat "$FILE_WRAPPER" >> temp_wrapper.c
          mv temp_wrapper.c "$FILE_WRAPPER"
          
          sed -i 's/p->ops\.iopoll/ksu_dummy_var/g' "$FILE_WRAPPER"
          sed -i 's/p->ops\.iterate_shared/ksu_dummy_var/g' "$FILE_WRAPPER"
          sed -i 's/p->ops\.copy_file_range/ksu_dummy_var/g' "$FILE_WRAPPER"
          sed -i 's/p->ops\.remap_file_range/ksu_dummy_var/g' "$FILE_WRAPPER"
          sed -i 's/p->ops\.fadvise/ksu_dummy_var/g' "$FILE_WRAPPER"
          sed -i 's/p->ops\.mmap_supported_flags/ksu_dummy_var/g' "$FILE_WRAPPER"
          
          sed -i 's/if (orig->f_op->iopoll)/if (0)/g' "$FILE_WRAPPER"
          sed -i 's/if (orig->f_op->iterate_shared)/if (0)/g' "$FILE_WRAPPER"
          sed -i 's/if (orig->f_op->copy_file_range)/if (0)/g' "$FILE_WRAPPER"
          sed -i 's/if (orig->f_op->remap_file_range)/if (0)/g' "$FILE_WRAPPER"
          sed -i 's/if (orig->f_op->fadvise)/if (0)/g' "$FILE_WRAPPER"
          
          sed -i 's/fp->f_op->iopoll/0/g' "$FILE_WRAPPER"
          sed -i 's/fp->f_op->iterate_shared/0/g' "$FILE_WRAPPER"
          sed -i 's/fp->f_op->copy_file_range/0/g' "$FILE_WRAPPER"
          sed -i 's/fp->f_op->remap_file_range/0/g' "$FILE_WRAPPER"
          sed -i 's/fp->f_op->fadvise/0/g' "$FILE_WRAPPER"
          sed -i 's/fp->f_op->mmap_supported_flags/0/g' "$FILE_WRAPPER"
          
          sed -i 's/orig->f_op->iopoll/ksu_dummy_func/g' "$FILE_WRAPPER"
          sed -i 's/orig->f_op->iterate_shared/ksu_dummy_func/g' "$FILE_WRAPPER"
          sed -i 's/orig->f_op->copy_file_range/ksu_dummy_func/g' "$FILE_WRAPPER"
          sed -i 's/orig->f_op->remap_file_range/ksu_dummy_func/g' "$FILE_WRAPPER"
          sed -i 's/orig->f_op->fadvise/ksu_dummy_func/g' "$FILE_WRAPPER"

          # 11. حل مشکل سیستم ردیابی رویدادها
          EVENT_QUEUE="drivers/KernelSU-Next/kernel/infra/event_queue.c"
          EVENT_QUEUE_H="drivers/KernelSU-Next/kernel/infra/event_queue.h"
          sed -i '1i typedef unsigned int __poll_t;' "$EVENT_QUEUE_H"
          sed -i '1i #define EPOLLIN POLLIN\n#define EPOLLHUP POLLHUP\n#define EPOLLRDNORM POLLRDNORM' "$EVENT_QUEUE"
          
          # 12. حل مشکلات Seccomp Cache
          SECCOMP_CACHE="drivers/KernelSU-Next/kernel/infra/seccomp_cache.c"
          cat <<EOF > temp_seccomp.c
          #include <linux/atomic.h>
          #include <asm/unistd.h>
          #ifndef SECCOMP_ARCH_NATIVE_NR
          #define SECCOMP_ARCH_NATIVE_NR 512
          #endif
          typedef atomic_t refcount_t;
          #define refcount_set atomic_set
          #define refcount_inc atomic_inc
          #define refcount_dec_and_test atomic_dec_and_test
          #define refcount_read atomic_read
          EOF
          cat "$SECCOMP_CACHE" >> temp_seccomp.c
          mv temp_seccomp.c "$SECCOMP_CACHE"

          # 13. حل مشکلات Mount Namespace
          SU_MOUNT="drivers/KernelSU-Next/kernel/infra/su_mount_ns.c"
          sed -i '1i #include <linux/err.h>\n#include <linux/syscalls.h>' "$SU_MOUNT"
          sed -i 's/ns_get_path(&ns_path, pid1_task, &mntns_operations)/PTR_ERR_OR_ZERO(ns_get_path(\&ns_path, pid1_task, \&mntns_operations))/g' "$SU_MOUNT"

          # 14. حل مشکل Symbol Resolver
          SYMBOL_RESOLVER="drivers/KernelSU-Next/kernel/infra/symbol_resolver.c"
          sed -i 's/= find_kernel_symbol_exact/= (void *)find_kernel_symbol_exact/g' "$SYMBOL_RESOLVER"
          
          # 15. حل مشکل تغییر آرگومان‌های تابع kernel_read در کرنل 4.4 با تزریق امن
          APK_SIGN="drivers/KernelSU-Next/kernel/manager/apk_sign.c"
          sed -i 's/kernel_read(/ksu_kernel_read(/g' "$APK_SIGN"
          cat <<EOF > temp_apk.c
          #include <linux/fs.h>
          #include <linux/types.h>
          static inline int ksu_kernel_read(struct file *file, void *buf, size_t count, loff_t *pos) {
              int ret = kernel_read(file, *pos, (char *)buf, count);
              if (ret > 0) *pos += ret;
              return ret;
          }
          EOF
          cat "$APK_SIGN" >> temp_apk.c
          mv temp_apk.c "$APK_SIGN"

          # 16. حل ناسازگاری خطرناک سیستم fsnotify در کرنل 4.4
          PKG_OBSERVER="drivers/KernelSU-Next/kernel/manager/pkg_observer.c"
          cat <<EOF > "$PKG_OBSERVER"
          int ksu_fsnotify_init(void) { return 0; }
          void ksu_fsnotify_exit(void) {}
          EOF
          
          # 17. حل مشکل Throne Tracker (استفاده از همون تابع ریدِ تزریقی و حذف آرگومان سوم هَش)
          THRONE="drivers/KernelSU-Next/kernel/manager/throne_tracker.c"
          sed -i 's/full_name_hash(NULL, /full_name_hash(/g' "$THRONE"
          sed -i 's/kernel_read(/ksu_kernel_read(/g' "$THRONE"
          cat <<EOF > temp_throne.c
          #include <linux/fs.h>
          #include <linux/types.h>
          static inline int ksu_kernel_read(struct file *file, void *buf, size_t count, loff_t *pos) {
              int ret = kernel_read(file, *pos, (char *)buf, count);
              if (ret > 0) *pos += ret;
              return ret;
          }
          EOF
          cat "$THRONE" >> temp_throne.c
          mv temp_throne.c "$THRONE"

          echo "Deep Patching completed successfully!"



      - name: Verify kernel source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Kernel source"
          echo "========================================"

          test -f Makefile
          test -f arch/arm64/configs/exynos7885-a20_defconfig

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          test -d "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          echo "Toolchain:"
          "$TOOLCHAIN/bin/aarch64-linux-android-gcc" --version

          echo
          echo "Kernel version:"
          make kernelversion

      - name: Configure
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          echo "========================================"
          echo "Fixing KSU integration in Kconfig"
          echo "========================================"
          
          # پاکسازی تلاش‌های قبلی
          sed -i '/kernelsu-next/d' arch/arm64/Kconfig || true
          sed -i '/KernelSU-Next/d' arch/arm64/Kconfig || true
          
          # حذف پیش‌نیازهای اجباری از فایل Kconfig اصلی کرنل‌سو
          sed -i '/depends on/d' drivers/KernelSU-Next/kernel/Kconfig
          
          # معرفی Kconfig جدید به سورس کرنل
          echo 'source "drivers/KernelSU-Next/kernel/Kconfig"' >> arch/arm64/Kconfig

          echo "========================================"
          echo "Patching defconfig and Generating .config"
          echo "========================================"

          # تزریق پیش‌نیازهای حیاتی و تنظیمات کرنل‌سو
          cat <<EOF >> arch/arm64/configs/exynos7885-a20_defconfig
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_HAVE_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_KSU_LEGACY=y
          EOF

          # تولید کانفیگ نهایی
          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            exynos7885-a20_defconfig

          echo "Config generated."

          # بررسی وضعیت نهایی
          if grep -q "CONFIG_KSU=y" .config; then
            echo "========================================"
            echo "SUCCESS: KernelSU Legacy is securely active in .config!"
            echo "========================================"
          else
            echo "ERROR: KernelSU configuration failed!"
            exit 1
          fi


      - name: Clean host tools
        shell: bash
        run: |
          rm -f scripts/dtc/dtc
          rm -f scripts/dtc/*.o
          rm -f scripts/dtc/dtc-lexer.lex.o
          rm -f scripts/dtc/dtc-parser.tab.o

      - name: Build kernel
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          # Old Samsung kernel DTC requires GCC common-symbol behavior.
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          echo "========================================"
          echo "Building A205F kernel with Legacy KSU Next"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            -j"$(nproc)"

      - name: Verify build output
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Build output"
          echo "========================================"

          echo
          echo "Image:"
          ls -lh arch/arm64/boot/Image 2>/dev/null || true

          echo
          echo "Compressed images:"
          find arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            \( -name 'Image*' -o -name 'zImage' \) \
            -exec ls -lh {} \; \
            2>/dev/null || true

          echo
          echo "DTB files:"
          find arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            -exec ls -lh {} \; \
            2>/dev/null || true

          echo
          echo "DTBO files:"
          find arch/arm64/boot/dts \
            -type f \
            -name '*.dtbo' \
            -exec ls -lh {} \; \
            2>/dev/null || true

      - name: Package artifacts
        if: success()
        shell: bash
        run: |
          set -e

          # اصلاح پوشه output و زیرپوشه‌ها
          mkdir -p output/dtb
          mkdir -p output/dtbo

          echo "========================================"
          echo "Collecting kernel and DTB files"
          echo "========================================"

          test -f arch/arm64/boot/Image

          cp -v arch/arm64/boot/Image output/Image

          if [ -f arch/arm64/boot/Image.gz ]; then
            cp -v arch/arm64/boot/Image.gz output/Image.gz
          fi

          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp -v {} output/dtb/ \; \
              || true

            find arch/arm64/boot/dts \
              -type f \
              -name '*.dtbo' \
              -exec cp -v {} output/dtbo/ \; \
              || true
          fi

          cp -v .config output/kernel.config

          echo
          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          find output -type f -exec ls -lh {} \;

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A205F-KernelSU-Next-Legacy
          path: output/
          if-no-files-found: error
          retention-days: 14
