name: Build A205F KernelSU Next (Legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel with Legacy KernelSU Next Integration
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      ANDROID_MAJOR_VERSION: r
      PLATFORM_VERSION: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            zip

      - name: Setup KernelSU Next (Legacy Integration)
        shell: bash
        run: |
          echo "========================================"
          echo "Integrating KernelSU Next Legacy Driver"
          echo "========================================"

          # کلون کردن سورس مستقیم در پوشه drivers به عنوان kernelsu-next (حذف -b next)
          git clone https://github.com/KernelSU-Next/KernelSU-Next drivers/kernelsu-next --depth 1

          # ویرایش فایل‌های Kconfig و Makefile اصلی برای ادغام درایور
          sed -i '/endmenu/s//endmenu\n\nsource "drivers\/kernelsu-next\/Kconfig"/' drivers/Kconfig
          echo 'obj-y += kernelsu-next/' >> drivers/Makefile

          # بررسی اضافه شدن موفقیت‌آمیز فایل‌ها و تنظیمات
          test -f drivers/kernelsu-next/Kconfig
          test -f drivers/kernelsu-next/Makefile
          grep "drivers/kernelsu-next" drivers/Kconfig
          grep "kernelsu-next" drivers/Makefile


      - name: Verify kernel source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Kernel source"
          echo "========================================"

          test -f Makefile
          test -f arch/arm64/configs/exynos7885-a20_defconfig

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          test -d "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          echo "Toolchain:"
          "$TOOLCHAIN/bin/aarch64-linux-android-gcc" --version

          echo
          echo "Kernel version:"
          make kernelversion

      - name: Configure
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          echo "========================================"
          echo "Generating A20 defconfig"
          echo "========================================"

          # تولید کانفیگ پایه از defconfig سامسونگ
          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            exynos7885-a20_defconfig

          # ایجاد یک فایل پچ کانفیگ برای KernelSU Next میراثی
          # نکته: ما از 'CONFIG_KSU_LEGACY=y' استفاده می‌کنیم که گزینه کلیدی برای این مشکل است.
          cat <<EOF > kernel/configs/ksu.config
          CONFIG_KSU=y
          CONFIG_KSU_LEGACY=y
          # برخی کرنل‌های قدیمی سامسونگ به این گزینه برای پایداری نیاز دارند
          # CONFIG_CC_STACKPROTECTOR_STRONG=y
          # اطمینان حاصل کنید که SELinux فعال است (اغلب به طور پیش‌فرض است)
          # CONFIG_SECURITY_SELINUX=y
          EOF

          # اعمال فایل پچ کانفیگ به .config تولید شده با استفاده از merge_config.sh
          scripts/kconfig/merge_config.sh -m .config kernel/configs/ksu.config

          echo
          echo "Config generated and KernelSU Legacy patches applied."

          # تایید نهایی فایل .config
          grep "CONFIG_KSU=y" .config
          grep "CONFIG_KSU_LEGACY=y" .config
          test -f .config

      - name: Clean host tools
        shell: bash
        run: |
          rm -f scripts/dtc/dtc
          rm -f scripts/dtc/*.o
          rm -f scripts/dtc/dtc-lexer.lex.o
          rm -f scripts/dtc/dtc-parser.tab.o

      - name: Build kernel
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          # Old Samsung kernel DTC requires GCC common-symbol behavior.
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          echo "========================================"
          echo "Building A205F kernel with Legacy KSU Next"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            -j"$(nproc)"

      - name: Verify build output
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Build output"
          echo "========================================"

          echo
          echo "Image:"
          ls -lh arch/arm64/boot/Image 2>/dev/null || true

          echo
          echo "Compressed images:"
          find arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            \( -name 'Image*' -o -name 'zImage' \) \
            -exec ls -lh {} \; \
            2>/dev/null || true

          echo
          echo "DTB files:"
          find arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            -exec ls -lh {} \; \
            2>/dev/null || true

          echo
          echo "DTBO files:"
          find arch/arm64/boot/dts \
            -type f \
            -name '*.dtbo' \
            -exec ls -lh {} \; \
            2>/dev/null || true

      - name: Package artifacts
        if: success()
        shell: bash
        run: |
          set -e

          # اصلاح پوشه output و زیرپوشه‌ها
          mkdir -p output/dtb
          mkdir -p output/dtbo

          echo "========================================"
          echo "Collecting kernel and DTB files"
          echo "========================================"

          test -f arch/arm64/boot/Image

          cp -v arch/arm64/boot/Image output/Image

          if [ -f arch/arm64/boot/Image.gz ]; then
            cp -v arch/arm64/boot/Image.gz output/Image.gz
          fi

          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp -v {} output/dtb/ \; \
              || true

            find arch/arm64/boot/dts \
              -type f \
              -name '*.dtbo' \
              -exec cp -v {} output/dtbo/ \; \
              || true
          fi

          cp -v .config output/kernel.config

          echo
          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          find output -type f -exec ls -lh {} \;

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A205F-KernelSU-Next-Legacy
          path: output/
          if-no-files-found: error
          retention-days: 14
