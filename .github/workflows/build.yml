name: Build A205F Kernel + KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      ANDROID_MAJOR_VERSION: r
      PLATFORM_VERSION: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            zip \
            curl

      - name: Integrate KernelSU Next (legacy + Manual Hooks)
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Integrating KernelSU Next (legacy)"
          echo "========================================"

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          echo
          echo "========================================"
          echo "Applying Manual Hooks (required for kernel 4.4)"
          echo "========================================"

          # ---------- 1. fs/exec.c ----------
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            # اضافه کردن declaration
            sed -i '/^int do_execve(struct filename \*filename,/i\
#ifdef CONFIG_KSU\n\
__attribute__((hot))\n\
extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\
\t\t\t\tvoid *argv, void *envp, int *flags);\n\
#endif' fs/exec.c

            # پچ do_execve
            sed -i '/^int do_execve(struct filename \*filename,/,/^}$/{
              /struct user_arg_ptr envp = { .ptr.native = __envp };/a\
#ifdef CONFIG_KSU\n\
\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n\
#endif
            }' fs/exec.c

            # پچ compat_do_execve (اگر وجود داشته باشه)
            if grep -q "compat_do_execve" fs/exec.c; then
              sed -i '/compat_do_execve/,/^}$/{
                /\.is_compat = true,/a\
#ifdef CONFIG_KSU\n\
\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n\
#endif
              }' fs/exec.c
            fi
            echo "[+] fs/exec.c patched"
          else
            echo "[*] fs/exec.c already patched"
          fi

          # ---------- 2. fs/open.c ----------
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/SYSCALL_DEFINE3(faccessat,/i\
#ifdef CONFIG_KSU\n\
__attribute__((hot))\n\
extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\
\t\t\t\tint *mode, int *flags);\n\
#endif' fs/open.c

            sed -i '/SYSCALL_DEFINE3(faccessat,/,/^}$/{
              /unsigned int lookup_flags = LOOKUP_FOLLOW;/a\
#ifdef CONFIG_KSU\n\
\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n\
#endif
            }' fs/open.c
            echo "[+] fs/open.c patched"
          else
            echo "[*] fs/open.c already patched"
          fi

          # ---------- 3. fs/read_write.c ----------
          if ! grep -q "ksu_handle_sys_read" fs/read_write.c; then
            sed -i '/SYSCALL_DEFINE3(read,/i\
#ifdef CONFIG_KSU\n\
extern bool ksu_vfs_read_hook __read_mostly;\n\
extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n\
\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n\
#endif' fs/read_write.c

            sed -i '/SYSCALL_DEFINE3(read,/,/^}$/{
              /struct fd f = fdget_pos(fd);/a\
#ifdef CONFIG_KSU\n\
\tif (unlikely(ksu_vfs_read_hook))\n\
\t\tksu_handle_sys_read(fd, \&buf, \&count);\n\
#endif
            }' fs/read_write.c
            echo "[+] fs/read_write.c patched"
          else
            echo "[*] fs/read_write.c already patched"
          fi

          # ---------- 4. fs/stat.c ----------
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            sed -i '/SYSCALL_DEFINE4(newfstatat,/i\
#ifdef CONFIG_KSU\n\
__attribute__((hot))\n\
extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\
\t\t\t\tint *flags);\n\
#endif' fs/stat.c

            sed -i '/SYSCALL_DEFINE4(newfstatat,/,/^}$/{
              /struct kstat stat;/a\
#ifdef CONFIG_KSU\n\
\tksu_handle_stat(\&dfd, \&filename, \&flag);\n\
#endif
            }' fs/stat.c
            echo "[+] fs/stat.c patched"
          else
            echo "[*] fs/stat.c already patched"
          fi

          # ---------- 5. kernel/reboot.c (مهم‌ترین برای چک Kbuild) ----------
          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            sed -i '/SYSCALL_DEFINE4(reboot,/i\
#ifdef CONFIG_KSU\n\
extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n\
#endif' kernel/reboot.c

            sed -i '/SYSCALL_DEFINE4(reboot,/,/^}$/{
              /struct pid_namespace \*pid_ns = task_active_pid_ns(current);/a\
#ifdef CONFIG_KSU\n\
\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n\
#endif
            }' kernel/reboot.c
            echo "[+] kernel/reboot.c patched"
          else
            echo "[*] kernel/reboot.c already patched"
          fi

          echo
          echo "Manual hooks applied successfully."

          # ---------- اضافه کردن کانفیگ‌ها به defconfig ----------
          DEFCONFIG="arch/arm64/configs/exynos7885-a20_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "Error: defconfig not found!"
            exit 1
          fi

          # پاک کردن کانفیگ‌های قبلی KernelSU اگر وجود داشته باشه
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/CONFIG_KPROBE/d' "$DEFCONFIG"

          cat >> "$DEFCONFIG" << 'EOF'

# KernelSU Next (Manual Hooks for 4.4)
CONFIG_KSU=y
CONFIG_KSU_MANUAL_HOOK=y
# CONFIG_KSU_KPROBES_HOOK is not set
EOF

          echo "KernelSU configs written to defconfig"

      - name: Verify kernel source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Kernel source verification"
          echo "========================================"

          test -f Makefile
          test -f arch/arm64/configs/exynos7885-a20_defconfig

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          test -d "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          echo "Toolchain:"
          "$TOOLCHAIN/bin/aarch64-linux-android-gcc" --version

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Checking KernelSU..."
          test -d KernelSU-Next || test -d drivers/kernelsu
          echo "KernelSU directory found."

          echo
          echo "Checking Manual Hooks..."
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c && echo "[OK] reboot hook"
          grep -q "ksu_handle_execveat" fs/exec.c && echo "[OK] execve hook"
          grep -q "ksu_handle_faccessat" fs/open.c && echo "[OK] faccessat hook"
          grep -q "ksu_handle_sys_read" fs/read_write.c && echo "[OK] read hook"
          grep -q "ksu_handle_stat" fs/stat.c && echo "[OK] stat hook"

      - name: Configure
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          echo "========================================"
          echo "Generating A20 defconfig"
          echo "========================================"

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            exynos7885-a20_defconfig

          test -f .config

          echo
          echo "KernelSU related configs in .config:"
          grep -E "CONFIG_KSU|CONFIG_KPROBE" .config || true

      - name: Clean host tools
        shell: bash
        run: |
          rm -f scripts/dtc/dtc
          rm -f scripts/dtc/*.o
          rm -f scripts/dtc/dtc-lexer.lex.o
          rm -f scripts/dtc/dtc-parser.tab.o

      - name: Build kernel
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          echo "========================================"
          echo "Building A205F kernel + KernelSU Next (Manual Hooks)"
          echo "========================================"

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            -j"$(nproc)"

      - name: Verify build output
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Build output"
          echo "========================================"

          echo
          echo "Image:"
          ls -lh arch/arm64/boot/Image 2>/dev/null || true

          echo
          echo "Compressed images:"
          find arch/arm64/boot -maxdepth 1 -type f \( -name 'Image*' -o -name 'zImage' \) -exec ls -lh {} \; 2>/dev/null || true

          echo
          echo "DTB files:"
          find arch/arm64/boot/dts -type f -name '*.dtb' -exec ls -lh {} \; 2>/dev/null || true

          echo
          echo "DTBO files:"
          find arch/arm64/boot/dts -type f -name '*.dtbo' -exec ls -lh {} \; 2>/dev/null || true

      - name: Package artifacts
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p output/dtb
          mkdir -p output/dtbo

          test -f arch/arm64/boot/Image
          cp -v arch/arm64/boot/Image output/Image

          if [ -f arch/arm64/boot/Image.gz ]; then
            cp -v arch/arm64/boot/Image.gz output/Image.gz
          fi

          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts -type f -name '*.dtb' -exec cp -v {} output/dtb/ \; || true
            find arch/arm64/boot/dts -type f -name '*.dtbo' -exec cp -v {} output/dtbo/ \; || true
          fi

          cp -v .config output/kernel.config

          echo
          echo "Final artifacts:"
          find output -type f -exec ls -lh {} \;

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A205F-kernel-KernelSU-Next
          path: output/
          if-no-files-found: error
          retention-days: 14